[project]
name = "numerotation-revolutionnaire"
version = "1.0.0"
description = "Annuaires parisiens du début du XIXe siècle : de l'OCR aux entrées structurées et alignées"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.1.0",
    "bs4>=0.0.2",
    "btrees<6",
    "dedupe>=3.0.3",
    "gliner>=0.2.29",
    "markdownify>=1.2.3",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "python-crfsuite>=0.9.12",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "scipy>=1.18.0",
    "streamlit>=1.64.0",
    "torch>=2.14.0",
    "transformers>=5.16.1",
]

[dependency-groups]
dev = [
    "black>=26.10.0",
    "ruff>=0.16.9",
]
explorations = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
]

[project.scripts]
numrev = "numrev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numrev"]

[tool.black]
line-length = 140
target-version = ["py312"]

[tool.ruff]
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]  # = règles par défaut de flake8 (pycodestyle + pyflakes), plus le tri des imports
