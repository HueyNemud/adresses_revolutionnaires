# Thème du viewer d'alignement : neutres « zinc » et un seul accent indigo
# (palette Tailwind), en clair et en sombre. Streamlit suit le réglage du
# système, l'utilisateur peut basculer dans ⋮ → Settings.
#
# Source unique : `numrev view alignment` passe ces valeurs en options de
# `streamlit run` (numrev/viewers/__init__.py), `numrev publish-viewer` les
# écrit dans `.streamlit/config.toml` du dépôt de déploiement. Les mêmes
# couleurs sont reprises dans assets/context.css et viewers/focus.py.

[theme]
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#4f46e5"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f5"
textColor = "#18181b"
linkColor = "#4f46e5"
borderColor = "#e4e4e7"
codeBackgroundColor = "#f4f4f5"

[theme.light.sidebar]
backgroundColor = "#fafafa"
secondaryBackgroundColor = "#f4f4f5"

[theme.dark]
primaryColor = "#818cf8"
backgroundColor = "#111113"
secondaryBackgroundColor = "#1c1c1f"
textColor = "#e4e4e7"
linkColor = "#a5b4fc"
borderColor = "#2e2e33"
codeBackgroundColor = "#1c1c1f"

[theme.dark.sidebar]
backgroundColor = "#0b0b0d"
secondaryBackgroundColor = "#18181b"
