# Thème du viewer d'alignement : gris et accent bleu classiques (palette
# Primer de GitHub), en clair et en sombre. Streamlit suit le réglage du
# système, l'utilisateur peut basculer dans ⋮ → Settings.
#
# Source unique : `numrev view alignment` passe ces valeurs en options de
# `streamlit run` (numrev/viewers/__init__.py), `numrev publish-viewer` les
# écrit dans `.streamlit/config.toml` du dépôt de déploiement. Les mêmes
# couleurs sont reprises dans assets/context.css et viewers/focus.py.

[theme]
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#0969da"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fa"
textColor = "#1f2328"
linkColor = "#0969da"
borderColor = "#d0d7de"
codeBackgroundColor = "#f6f8fa"

[theme.light.sidebar]
backgroundColor = "#f6f8fa"
secondaryBackgroundColor = "#eaeef2"

[theme.dark]
primaryColor = "#4493f8"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
linkColor = "#4493f8"
borderColor = "#30363d"
codeBackgroundColor = "#161b22"

[theme.dark.sidebar]
backgroundColor = "#010409"
secondaryBackgroundColor = "#161b22"
